[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tta"
version = "0.0.1"
authors = [
  { name="Faizi Fifita", email="author@example.com" },
  { name="Nathan Lane", email="nathanlane510@gmail.com" },
  { name="Derrick Strover", email="dstroverduncan@yahoo.com" },
  { name="Travis Loukusa", email="dl2625pv@go.minnstate.edu" },
]
description = "tta (Text-to-Audiobook), as the name suggests, transforms book text in a multi-speaker audiobook experience."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "openai==0.27.0",
    "python-dotenv==1.0.0",
    "pytest==8.3.3",
]

[project.urls]
Homepage = "https://github.com/FayZ676/audiobook-generator"
Issues = "https://github.com/FayZ676/audiobook-generator/issues"
