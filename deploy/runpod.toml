# Everything deployed to RunPod. `make plan` shows what differs from this,
# `make apply` makes RunPod match it.
#
# Each [endpoints.X] table is sent as RunPod's REST v2 endpoint body
# (https://api.runpod.io/v2/openapi.json), plus three keys of ours:
#   image: the repository; its tag is the last commit that touched `paths`,
#          which is the tag CI pushes (.github/workflows/images.yml)
#   paths: what the image is built from, relative to the repo root
#   context, dockerfile: how CI builds it

registry = "ghcr.io/fayz676"

# RunPod secret name = the variable in .env.local holding its value.
# Endpoints read them as "{{ RUNPOD_SECRET_<name> }}".
[secrets]
anthropic_api_key = "ANTHROPIC_API_KEY"
openai_api_key = "OPENAI_API_KEY"

[endpoints.tta-script]
image = "tta-script"
paths = ["script"]
context = "script"
dockerfile = "script/Dockerfile"
cpu = [{ id = "cpu5c", vcpuCount = 2 }]
# Economical while testing: never a worker running unless there's a job,
# one at a time, and a stuck job is cut off rather than billed for long.
workers = { min = 0, max = 1, idleTimeout = 5 }
scaling = { type = "QUEUE_DELAY", queueDelay = 4 }
timeout = 300000  # ms; a chapter takes seconds, a whole-chapter recheck up to a minute
disk = 5

[endpoints.tta-script.env]
ANTHROPIC_API_KEY = "{{ RUNPOD_SECRET_anthropic_api_key }}"
OPENAI_API_KEY = "{{ RUNPOD_SECRET_openai_api_key }}"

[endpoints.tta-narration]
image = "tta-narration"
paths = ["narration", "script"]
context = "."
dockerfile = "narration/Dockerfile"
# Economical while testing: 24 GB is all the 1.7B model needs, the
# $0.75/hr pool (RTX 3090, L4, A5000) comes before the $1.34/hr one
# (RTX 4090), never a worker running unless there's a job (min 0: an
# always-on worker is ruled out), one at a time, a worker stops 30s after
# its last job, and a stuck job is cut off at 10 minutes. FlashBoot is
# what makes restarts quick despite the short idle time.
gpu = { pools = ["AMPERE_24", "ADA_24"], count = 1 }
workers = { min = 0, max = 1, idleTimeout = 30 }
scaling = { type = "QUEUE_DELAY", queueDelay = 4 }
flashboot = "FLASHBOOT"
timeout = 600000  # ms; about 25 minutes of audio at the GPU's 2.6x real time
disk = 30
