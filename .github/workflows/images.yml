# Builds each RunPod worker's image on every push to main and pushes it to
# GHCR, tagged with the last commit that touched what it's built from. An
# image whose tag already exists is skipped. deploy/runpod.toml says what
# the images are; `python3 -m deploy apply` then points RunPod at them.
name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: images
        run: echo "images=$(python3 -m deploy images)" >> "$GITHUB_OUTPUT"

  build:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.list.outputs.images) }}
    name: ${{ matrix.image.name }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if docker buildx imagetools inspect "${{ matrix.image.image }}" > /dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.image.image }} is already built"
          fi
      # The narration image (CUDA PyTorch plus the model) needs more disk than
      # / has free; the runner's /mnt has plenty and costs seconds to use,
      # where deleting preinstalled tools to make room took two minutes.
      - if: steps.exists.outputs.built != 'true'
        run: |
          sudo systemctl stop docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h /mnt
      - if: steps.exists.outputs.built != 'true'
        uses: actions/checkout@v4
      - if: steps.exists.outputs.built != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.exists.outputs.built != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.image.image }}
          # Layers unchanged since the last build come from here instead of
          # being rebuilt, so a code change ships only the code layers.
          cache-from: type=registry,ref=${{ matrix.image.repository }}:buildcache
          cache-to: type=registry,ref=${{ matrix.image.repository }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
