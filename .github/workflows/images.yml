# Builds each RunPod worker's image on every push to main and pushes it to
# GHCR, tagged with the last commit that touched what it's built from. An
# image whose tag already exists is skipped. deploy/runpod.toml says what
# the images are; `python3 -m deploy apply` then points RunPod at them.
name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: images
        run: echo "images=$(python3 -m deploy images)" >> "$GITHUB_OUTPUT"

  build:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.list.outputs.images) }}
    name: ${{ matrix.image.name }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if docker buildx imagetools inspect "${{ matrix.image.image }}" > /dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.image.image }} is already built"
          fi
      # The narration image (CUDA PyTorch plus the model) needs more disk
      # than a runner has free.
      - if: steps.exists.outputs.built != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - if: steps.exists.outputs.built != 'true'
        uses: actions/checkout@v4
      - if: steps.exists.outputs.built != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.exists.outputs.built != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.image.image }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
