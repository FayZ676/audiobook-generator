services:
  - type: web
    name: audiobook-generator-service
    runtime: docker
    repo: https://github.com/FayZ676/audiobook-generator
    plan: free
    envVars:
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: SERVICE_API_URL
        sync: false
      - key: SCRIPT_API_URL
        sync: false
      - key: SCRIPT_SERVICE_API_KEY
        sync: false
      - key: SPEECH_API_URL
        sync: false
      - key: SPEECH_SERVICE_API_KEY
        sync: false
      - key: PUSHER_APP_ID
        sync: false
      - key: PUSHER_KEY
        sync: false
      - key: PUSHER_SECRET
        sync: false
      - key: PUSHER_CLUSTER
        sync: false
      - key: VOICES_BUCKET
        sync: false
      - key: SCRIPT_RESULTS_BUCKET
        sync: false
      - key: SPEECH_RESULTS_BUCKET
        sync: false
      - key: TEXT_FILES_BUCKET
        sync: false
      - key: JOB_STATUS_BUCKET
        sync: false
    region: oregon
    dockerContext: .
    dockerfilePath: service/Dockerfile
version: "1"
