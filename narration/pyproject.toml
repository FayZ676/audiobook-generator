[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tta_narration"
version = "0.0.1"
description = "Reads a checked audiobook script aloud in a speech model's preset voices."
requires-python = ">=3.10"
dependencies = [
  "av==18.1.0",  # AAC (.m4a), with its own ffmpeg
  "lameenc==1.9.0",
  "numpy",
  "pydantic>=2.0.0",
  "requests",
  "runpod==1.7.9",
  "tta_script",  # the script and cast types; install ../script first
]

[project.optional-dependencies]
# Both also need espeak-ng from the system: brew install espeak-ng (Mac), apt (the image).
cuda = ["kokoro==0.9.4"]  # RunPod
mlx = ["mlx-audio==0.6.4", "misaki[en]==0.9.4"]  # a Mac

[project.urls]
Homepage = "https://github.com/FayZ676/audiobook-generator"
Issues = "https://github.com/FayZ676/audiobook-generator/issues"
