[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tta_narration"
version = "0.0.1"
description = "Reads a checked audiobook script aloud with cloned voices."
requires-python = ">=3.10"
dependencies = [
  "lameenc==1.9.0",
  "numpy",
  "pydantic>=2.0.0",
  "requests",
  "runpod==1.7.9",
  "tta_script",  # the script and cast types; install ../script first
]

[project.optional-dependencies]
cuda = ["qwen-tts==0.1.1"]  # RunPod
mlx = ["mlx-audio==0.6.4"]  # a Mac, for trying it locally

[project.urls]
Homepage = "https://github.com/FayZ676/audiobook-generator"
Issues = "https://github.com/FayZ676/audiobook-generator/issues"
