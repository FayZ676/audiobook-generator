AWSTemplateFormatVersion: "2010-09-09"

Resources:
  VoicesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: tta-voices

  SpeechResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: tta-speech-results

  JobStatusBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: tta-job-status

  LogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: tta-log-files

  ProjectsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: tta-projects

  # Need to manually create access keys for the user.
  SpeechServiceUser:
    Type: AWS::IAM::User
    Properties:
      UserName: SpeechServiceUser

  # Need to rename this policy to be more general.
  SpeechServiceIAMPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: SpeechServiceS3ReadWritePolicy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:ListBucket
            Resource:
              - !Sub "arn:aws:s3:::${SpeechResultsBucket}/*"
              - !Sub "arn:aws:s3:::${VoicesBucket}/*"
              - !Sub "arn:aws:s3:::${JobStatusBucket}/*"
              - !Sub "arn:aws:s3:::${LogsBucket}/*"
              - !Sub "arn:aws:s3:::${ProjectsBucket}/*"
              - !Sub "arn:aws:s3:::${SpeechResultsBucket}"
              - !Sub "arn:aws:s3:::${VoicesBucket}"
              - !Sub "arn:aws:s3:::${JobStatusBucket}"
              - !Sub "arn:aws:s3:::${ProjectsBucket}"
      Users:
        - !Ref SpeechServiceUser
